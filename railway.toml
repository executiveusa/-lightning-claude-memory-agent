# Railway.app deployment configuration for Agent Lightning
# Zero-secrets deployment with cost-protection guardrails

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "python -m agentlightning.server"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Cost protection: enforce minimal resource usage
numReplicas = 1

# Resource limits to stay within free tier
[deploy.resources]
# Railway free tier: 512MB RAM, 1 vCPU shared
memoryLimit = "512Mi"
cpuLimit = "0.5"

[env]
# Core required environment variables (values set via Railway dashboard)
# OPENAI_API_KEY = "set-via-railway-dashboard"
# OPENAI_BASE_URL = "set-via-railway-dashboard"

# Optional integrations - disabled by default for zero-secrets deployment
AGENTOPS_API_KEY = "dummy"
CREWAI_DISABLE_TELEMETRY = "true"
PYTHONUTF8 = "1"

# Agent Lightning runtime configuration
AGL_MANAGED_STORE = "false"
AGL_SERVER_HOST = "0.0.0.0"
PORT = "8080"

# Python optimization for limited resources
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"

# Cost monitoring configuration
RAILWAY_COST_PROTECTION_ENABLED = "true"
RAILWAY_MAX_MONTHLY_COST = "5.00"
RAILWAY_AUTO_SHUTDOWN_ON_LIMIT = "true"

[[monitor]]
# Free tier usage monitoring
metric = "cpu"
threshold = 80
window = 300

[[monitor]]
metric = "memory"
threshold = 90
window = 300

[services.web]
# Main web service configuration
port = 8080
protocol = "http"

[services.web.healthcheck]
path = "/health"
interval = 30
timeout = 10
unhealthyThreshold = 3
healthyThreshold = 2
