name: Lightning Terabithia Adapter CI
on:
  pull_request:
    paths:
      - "agentlightning/terabithia_api.py"
      - "agentlightning/__init__.py"
      - ".github/workflows/terabithia-adapter.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile agentlightning/terabithia_api.py agentlightning/__init__.py
